<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#2a2358"/><stop offset="0.55" stop-color="#151d36"/><stop offset="1" stop-color="#0b1222"/></radialGradient>
    <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#8d99ae"/><stop offset="0.35" stop-color="#f1f5f9"/><stop offset="0.6" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></linearGradient>
    <radialGradient id="bowl" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#cbd5e1"/><stop offset="1" stop-color="#64748b"/></radialGradient>
    <linearGradient id="handle" x1="0" x2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="0.4" stop-color="#475569"/><stop offset="0.7" stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="servo" x1="0" x2="1"><stop offset="0" stop-color="#312e81"/><stop offset="0.5" stop-color="#6d28d9"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#94a3b8"><path d="M0 640 H600 M0 680 H600 M0 720 H600" /></g>
  <ellipse cx="300" cy="735" rx="150" ry="18" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <!-- tremor trace in, steady out -->
  <path d="M40 300 q12 -30 24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.7"/>
  <path d="M440 300 h120" fill="none" stroke="#67e8f9" stroke-width="3.5"/>
  <g transform="rotate(-8 300 420)">
    <!-- spoon bowl + neck -->
    <ellipse cx="300" cy="140" rx="64" ry="86" fill="url(#bowl)"/>
    <ellipse cx="300" cy="134" rx="46" ry="64" fill="#e2e8f0" opacity="0.65"/>
    <rect x="290" y="210" width="20" height="120" rx="10" fill="url(#steel)"/>
    <!-- gimbal: two servo blocks -->
    <rect x="262" y="318" width="76" height="52" rx="12" fill="url(#servo)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <circle cx="300" cy="344" r="11" fill="#c4b5fd"/>
    <rect x="252" y="372" width="96" height="44" rx="12" fill="url(#servo)" stroke="#a78bfa" stroke-opacity="0.6"/>
    <circle cx="276" cy="394" r="8" fill="#c4b5fd"/>
    <!-- handle -->
    <rect x="248" y="414" width="104" height="300" rx="48" fill="url(#handle)" stroke="#64748b" stroke-opacity="0.6"/>
    <rect x="268" y="470" width="64" height="8" rx="4" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="300" cy="520" r="9" fill="#06b6d4" filter="url(#glow)"/>
    <rect x="276" y="560" width="48" height="110" rx="20" fill="#0f172a" opacity="0.55"/>
  </g>
  <text x="300" y="776" fill="#94a3b8" font-family="Sora, Arial, sans-serif" font-size="18" text-anchor="middle">TremoSense · concept render</text>
</svg>
